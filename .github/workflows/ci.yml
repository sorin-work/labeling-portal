name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labeling
          POSTGRES_PASSWORD: labeling
          POSTGRES_DB: labeling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labeling -d labeling_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://labeling:labeling@localhost:5432/labeling_test
      TEST_DATABASE_URL: postgresql://labeling:labeling@localhost:5432/labeling_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
