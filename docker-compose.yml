name: labeling-portal

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labeling
      POSTGRES_PASSWORD: labeling
      POSTGRES_DB: labeling
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labeling -d labeling']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      # The name is what a refused restore lists as still connected.
      DATABASE_URL: postgresql://labeling:labeling@db:5432/labeling?application_name=labeling-portal
      # Empty by default: the container then makes a random one on its first
      # start and keeps it in the app-data volume. A published sample value
      # is refused in production.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Encrypts the two-step secrets; there is no default here, and two-step
      # sign-in refuses to start without it. Keep it with your backups:
      # without it nobody with two-step on can sign in until an admin resets
      # them.
      TOTP_KEY: ${TOTP_KEY:-}
      # Creates the demo organisation, users and projects on first start.
      SEED_DEMO: ${SEED_DEMO:-true}
      # Lists the demo accounts on the sign-in page.
      SHOW_DEMO_LOGINS: ${SHOW_DEMO_LOGINS:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The sign-in limits count per client address: the connection's own
      # address, or with this set to true the last X-Forwarded-For entry. Set
      # it behind a proxy, or every client has the proxy's address and one
      # attacker can lock the owner out for fifteen minutes.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # The app runs the background jobs itself unless this is false; then
      # start the worker service (profile "worker") to run them.
      JOBS_IN_WEB: ${JOBS_IN_WEB:-true}
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only this machine can reach the app. Put a proxy in front to serve it
      # to others (and set TRUST_PROXY=true there).
      - '127.0.0.1:${WEB_PORT:-4421}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Optional: the background jobs in a process of their own, with the same
  # image. Start it with JOBS_IN_WEB=false docker compose --profile worker up -d
  worker:
    build: .
    profiles: [worker]
    restart: unless-stopped
    command: ['node', 'docker/worker.mjs']
    environment:
      DATABASE_URL: postgresql://labeling:labeling@db:5432/labeling?application_name=labeling-worker
      SESSION_SECRET: ${SESSION_SECRET:-}
    # the same generated session secret as the app
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # Optional, start it with: docker compose --profile backup up -d
  # Dumps the database once a day into BACKUP_DIR and keeps the newest
  # BACKUP_KEEP dumps. See "Backup and restore" in the README.
  backup:
    image: postgres:17-alpine
    profiles: [backup]
    restart: unless-stopped
    entrypoint: ['sh', '/backup.sh']
    environment:
      PGHOST: db
      PGUSER: labeling
      PGPASSWORD: labeling
      PGDATABASE: labeling
      PGAPPNAME: labeling-backup
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_STATUS: ${BACKUP_STATUS:-on}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  db-data:
  # the session secret made on first start, when SESSION_SECRET is unset
  app-data:
